sonar.projectKey=LemontechSA_speller
sonar.projectName=speller

sonar.language=ruby
# Explicit list instead of ".": in CI, ruby/setup-ruby installs the gems in
# vendor/bundle and coverage/ holds SimpleCov's HTML/JS, neither is ours.
sonar.sources=speller.rb,config.ru
sonar.tests=test
sonar.ruby.coverage.reportPaths=coverage/.resultset.json
# SimpleCov only covers speller.rb (cover 'speller.rb' in test/test_helper.rb)
sonar.coverage.exclusions=config.ru
